<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    游离基（free radical）—— 追击者
    改造前：正三角形 + 内三角 + 一个圆，纯几何图标。
    现在：带缺口与碎裂边缘的三角（读作"未配对的单电子正在撕裂结构"），
    左侧单电子用独立小核 + 连杆表现，不再是居中那个白圆。
  -->
  <defs>
    <radialGradient id="frGlow" cx="62%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fff1f3" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 主三角：顶点偏移 + 右侧开口，破除对称 -->
  <path d="M50 10 L86 74 L16 79" fill="#2a0d16" fill-opacity=".72"
        stroke="#ff5c7a" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 内层碎片：小三角带缺口，暗示结构不完整 -->
  <path d="M50 26 L70 62 L32 65 L46 48 Z" fill="none"
        stroke="#ffb3c1" stroke-width="2.6" stroke-opacity=".75" stroke-linejoin="round"/>
  <!-- 裂痕：三条不等长放射线，指向未配对电子 -->
  <g stroke="#fff1f3" stroke-linecap="round" fill="none">
    <path d="M50 20 L52 38" stroke-width="3.2" stroke-opacity=".9"/>
    <path d="M44 46 L38 56" stroke-width="2.2" stroke-opacity=".6"/>
    <path d="M56 46 L63 55" stroke-width="1.8" stroke-opacity=".45"/>
  </g>
  <!-- 未配对电子：偏心的小核 + 轨道残迹（这是"自由基"的定义） -->
  <circle cx="31" cy="27" r="9" fill="url(#frGlow)"/>
  <circle cx="31" cy="27" r="4.5" fill="#ffffff"/>
  <path d="M25 21 A9 9 0 0 1 38 31" fill="none" stroke="#ffffff"
        stroke-width="1.8" stroke-opacity=".55" stroke-linecap="round"/>
</svg>
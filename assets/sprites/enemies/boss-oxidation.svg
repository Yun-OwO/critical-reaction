<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!--
    氧化之主 · 最终 Boss（P1 纵切：实体化）
    原版是 fill="none" 六边形 + 火焰轮廓 —— 普通混合下会淡。
    改造为「高温反应炉」：
      ① 暗面炉体（实心六边形，提供体积）
      ② 中间调炉衬（炉壁，暗示容器）
      ③ 燃烧膛（火焰形，温度熔毁的核心视觉）
      ④ 散热裂隙（炉壁裂缝，读作"过热"）
  -->
  <defs>
    <linearGradient id="furnaceBody" x1="20%" y1="8%" x2="80%" y2="92%">
      <stop offset="0%" stop-color="#6b2a1a"/>
      <stop offset="50%" stop-color="#42160c"/>
      <stop offset="100%" stop-color="#220b06"/>
    </linearGradient>
    <radialGradient id="combustion" cx="50%" cy="58%" r="52%">
      <stop offset="0%" stop-color="#fff4e0"/>
      <stop offset="35%" stop-color="#ff8a5c" stop-opacity=".9"/>
      <stop offset="75%" stop-color="#e03a1a" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#7c1a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ① 暗面炉体 -->
  <polygon points="96,12 168,54 168,138 96,180 24,138 24,54"
           fill="url(#furnaceBody)"
           stroke="#ff3b30" stroke-width="8" stroke-linejoin="round"/>
  <!-- ② 中间调炉衬 -->
  <polygon points="96,36 150,66 150,126 96,156 42,126 42,66"
           fill="#3d1409" fill-opacity=".88"
           stroke="#ff8a5c" stroke-width="2" stroke-opacity=".5" stroke-linejoin="round"/>

  <!-- ③ 燃烧膛：火焰形（保留原造型语汇，改为实心发光体） -->
  <path d="M96 48 C124 68 124 124 96 144 C68 124 68 68 96 48 Z" fill="url(#combustion)"/>
  <path d="M96 66 C112 80 112 112 96 126 C80 112 80 80 96 66 Z" fill="#ffd0a8" fill-opacity=".55"/>

  <!-- ④ 散热裂隙：炉壁裂缝，读作"过热"（与燃烧膛方向错开） -->
  <g stroke="#ffb08a" stroke-linecap="round" fill="none">
    <path d="M52 78 L62 88 L56 98" stroke-width="3" stroke-opacity=".75"/>
    <path d="M140 78 L130 88 L136 98" stroke-width="3" stroke-opacity=".75"/>
    <path d="M58 118 L68 124" stroke-width="2.4" stroke-opacity=".5"/>
    <path d="M134 118 L124 124" stroke-width="2.4" stroke-opacity=".5"/>
  </g>
  <!-- 炉心 -->
  <circle cx="96" cy="96" r="11" fill="#fff4e0" fill-opacity=".9"/>
</svg>
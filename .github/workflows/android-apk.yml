name: Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.*'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21（Android Gradle Plugin 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建游戏（Vite → dist）
        run: npm run build

      - name: 同步 Web 资产到 Android 工程
        run: npx cap sync android

      - name: 打包 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 构建产物（每次构建可在 Actions 页面下载）
        uses: actions/upload-artifact@v4
        with:
          name: critical-reaction-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 发布到 Releases（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
